{% extends "base.html" %}{% block title %}策略管理{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4><i class="bi bi-lightning"></i> 策略管理</h4>
    <div class="d-flex gap-2">
        <a href="{% url 'strategy_create' %}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> 手动创建</a>
        <a href="{% url 'strategy_ai_generate' %}" class="btn btn-outline-primary"><i class="bi bi-robot"></i> AI生成</a>
    </div>
</div>
<div class="row">
    {% for s in strategies %}
    <div class="col-md-4 mb-3"><div class="card p-3">
        <div class="d-flex justify-content-between"><h6>{{ s.name }}</h6>{% if s.is_ai_generated %}<span class="badge bg-info">AI</span>{% endif %}</div>
        <small class="text-muted">{{ s.get_strategy_type_display }} | {{ s.get_params_display }}</small>
        <div class="mt-2"><a href="{% url 'strategy_detail' s.id %}" class="btn btn-sm btn-outline-primary">详情</a></div>
    </div></div>
    {% empty %}<div class="col-12 text-center text-muted py-4">暂无策略</div>{% endfor %}
</div>
{% endblock %}
