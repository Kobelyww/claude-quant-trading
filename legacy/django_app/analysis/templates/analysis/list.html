{% extends "base.html" %}{% block title %}AI 分析报告{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4><i class="bi bi-robot"></i> AI 分析报告</h4>
    <a href="{% url 'analysis_run' %}" class="btn btn-primary"><i class="bi bi-stars"></i> 生成报告</a>
</div>
<div class="card"><table class="table table-hover mb-0"><thead><tr><th>ID</th><th>标的</th><th>类型</th><th>时间</th><th>操作</th></tr></thead><tbody>
{% for r in reports %}
<tr><td>#{{ r.id }}</td><td>{{ r.symbol.code }}</td><td>{{ r.get_report_type_display }}</td>
    <td><small>{{ r.created_at|date:"Y-m-d H:i" }}</small></td>
    <td><a href="{% url 'analysis_detail' r.id %}" class="btn btn-sm btn-outline-primary">查看</a></td></tr>
{% empty %}<tr><td colspan="5" class="text-center text-muted py-4">暂无分析报告</td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
