{% extends "base.html" %}{% block title %}生成AI分析{% endblock %}
{% block content %}
<h4><i class="bi bi-robot"></i> 生成AI分析报告</h4>
<div class="card p-4"><form method="post">{% csrf_token %}
    <div class="row g-3">
        <div class="col-md-6"><label class="form-label">标的 *</label><select name="symbol_id" class="form-select" required>
            <option value="">选择标的</option>{% for s in symbols %}<option value="{{ s.id }}">{{ s.code }}</option>{% endfor %}</select></div>
        <div class="col-md-6"><label class="form-label">分析类型</label><select name="report_type" class="form-select">
            {% for val, label in types %}<option value="{{ val }}">{{ label }}</option>{% endfor %}</select></div>
        <div class="col-12"><button type="submit" class="btn btn-primary"><i class="bi bi-stars"></i> 生成报告 (DeepSeek)</button></div>
    </div>
</form></div>
<a href="{% url 'analysis_list' %}" class="btn btn-secondary mt-3">返回</a>
{% endblock %}
