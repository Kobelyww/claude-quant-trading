{% extends "base.html" %}{% block title %}API 设置{% endblock %}
{% block content %}
<h4><i class="bi bi-gear"></i> API 配置</h4>
<div class="row">
    <div class="col-lg-6">
        <div class="card p-4 mb-3">
            <h5><i class="bi bi-cpu"></i> DeepSeek API</h5>
            <hr>
            <form method="post">{% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">API Key</label>
                    <input type="password" name="api_key" class="form-control" value="{{ api_key }}" placeholder="sk-...">
                    <small class="text-muted">在 <a href="https://platform.deepseek.com/api_keys" target="_blank">DeepSeek 平台</a> 获取</small>
                </div>
                <div class="mb-3">
                    <label class="form-label">API Base URL</label>
                    <input type="text" name="api_base" class="form-control" value="{{ api_base }}" placeholder="https://api.deepseek.com">
                </div>
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> 保存配置</button>
            </form>
        </div>
    </div>
    <div class="col-lg-6">
        <div class="card p-4">
            <h5>状态</h5>
            <hr>
            <p>API Key: {% if has_key %}<span class="badge bg-success">已配置</span>{% else %}<span class="badge bg-danger">未配置</span>{% endif %}</p>
            <p>API Base: <code>{{ api_base }}</code></p>
            <hr>
            <small class="text-muted">配置会存入数据库并写入 .env 文件，服务重启后仍有效。</small>
        </div>
    </div>
</div>
{% endblock %}
